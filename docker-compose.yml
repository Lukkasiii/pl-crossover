services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      PL_CORS_ORIGINS: http://localhost:5173
      PL_JWT_SECRET: ${PL_JWT_SECRET:-dev-secret-change-me}

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api
