name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest api/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run test
      # src/api/schema.ts is generated from the FastAPI OpenAPI schema
      # (openapi-typescript, see package.json's generate:types) and committed
      # rather than built at deploy time, so the frontend can typecheck
      # against the real contract without a server running. Regenerating and
      # diffing here is what keeps a route change from silently drifting the
      # committed types out of date.
      - run: npm run generate:types
      - run: git diff --exit-code -- src/api/schema.ts

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # playwright.config.ts's webServer runs .venv/bin/python (same command
      # as local dev, CLAUDE.md's Setup section) rather than branching on
      # environment, so CI needs the venv at the same repo-root path.
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - name: wait for api and web to answer
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/seasons > /dev/null && curl -sf http://localhost:5173/ > /dev/null && exit 0
            sleep 2
          done
          echo "api or web never came up"
          docker compose logs
          exit 1
      - run: docker compose logs
        if: always()
      - run: docker compose down

  deploy-demo:
    needs: [backend, frontend, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements.txt
      - run: npm ci
        working-directory: web
      - run: npm run demo:data
        working-directory: web
      - run: npm run build:demo
        working-directory: web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
